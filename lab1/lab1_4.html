<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Простые числа</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 1rem;
      background: #f5f5f5;
    }
    form {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    label {
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0 1rem 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #004d99;
    }
    .error {
      color: red;
      font-size: 0.9rem;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
    }
    .result {
      background: #f0f0f0;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      font-family: monospace;
      font-size: 1rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<h1>Простые числа</h1>

<form id="primeForm">
  <label for="n">Введите число n (от 2 и выше):</label>
  <input type="number" id="n" name="n" step="1" min="2">
  <div id="error" class="error"></div>

  <button type="submit">Найти</button>
</form>

<div id="result" class="result"></div>

<script src="../js/lab1_4.js"></script>
</body>
</html>
