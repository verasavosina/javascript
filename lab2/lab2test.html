<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тесты Mocha — Лабораторная 2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mocha/10.2.0/mocha.css">
</head>
<body>
  <div id="mocha"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mocha/10.2.0/mocha.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chai/4.3.7/chai.js"></script>
  <script>mocha.setup('bdd');</script>

  <script src="lab2.js"></script>

  <script>
    const { expect } = chai;

    describe('pow(x, n)', () => {
      it('2^2 = 4', () => { expect(pow(2, 2)).to.equal(4); });
      it('2^0 = 1', () => { expect(pow(2, 0)).to.equal(1); });
      it('2^-2 = 0.25', () => { expect(pow(2, -2)).to.equal(0.25); });
    });

    describe('sumTo(n)', () => {
      it('sumTo(100) = 5050', () => { expect(sumTo(100)).to.equal(5050); });
    });

    describe('isLeapYear(year)', () => {
      it('2024 -> true', () => { expect(isLeapYear(2024)).to.be.true; });
      it('2025 -> false', () => { expect(isLeapYear(2025)).to.be.false; });
      it('2000 -> true', () => { expect(isLeapYear(2000)).to.be.true; });
      it('1900 -> false', () => { expect(isLeapYear(1900)).to.be.false; });
    });

    describe('factorial(n) — BigInt', () => {
      it('factorial(0) = 1n', () => { expect(factorial(0)).to.equal(1n); });
      it('factorial(5) = 120n', () => { expect(factorial(5)).to.equal(120n); });
    });

    describe('fib(n) — BigInt', () => {
      it('fib(0) = 0n', () => { expect(fib(0)).to.equal(0n); });
      it('fib(100) = 354224848179261915075n', () => {
        expect(fib(100)).to.equal(354224848179261915075n);
      });
    });

    describe('compare(x)', () => {
      const cmp5 = compare(5);
      it('compare(5)(4) -> false', () => { expect(cmp5(4)).to.be.false; });
      it('compare(5)(5) -> null', () => { expect(cmp5(5)).to.be.null; });
      it('compare(5)(6) -> true', () => { expect(cmp5(6)).to.be.true; });
    });

    describe('sum(...args)', () => {
      it('sum() = 0', () => { expect(sum()).to.equal(0); });
      it('sum(1) = 1', () => { expect(sum(1)).to.equal(1); });
      it('sum(1, 2) = 3', () => { expect(sum(1, 2)).to.equal(3); });
    });

    describe('addBlackSpot(obj)', () => {
      it('добавляет Symbol.for("blackSpot") = true', () => {
        const obj = {};
        const result = addBlackSpot(obj);
        const sym = Symbol.for('blackSpot');
        expect(result[sym]).to.be.true;
        expect(result).to.equal(obj);
      });
    });

    mocha.run();
  </script>
</body>
</html>
