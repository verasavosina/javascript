<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плейсхолдер на JavaScript</title>
    <style>
        .placeholder {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Плейсхолдер-подсказка</h1>
    <input type="text" id="myInput" data-placeholder="Введите ваше имя">

    <script>
        const input = document.getElementById('myInput');
        const placeholderText = input.getAttribute('data-placeholder');
        input.value = placeholderText;
        input.classList.add('placeholder');

        input.addEventListener('focus', () => {
            if (input.value === placeholderText) {
                input.value = '';
                input.classList.remove('placeholder');
            }
            //подсказка над полем
            input.placeholder = placeholderText;
        });

        input.addEventListener('blur', () => {
            if (input.value === '') {
                input.value = placeholderText;
                input.classList.add('placeholder');
            }
            input.placeholder = '';
        });
    </script>
</body>
</html>
